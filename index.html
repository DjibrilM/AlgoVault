<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AlgoVault</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background-color: #141414;
        color: #E5E5E5;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }
      .av-boot-splash {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        background-color: #141414;
        user-select: none;
      }
      .av-boot-logo {
        width: 76px;
        height: 76px;
        object-fit: contain;
      }
      .av-boot-title {
        font-size: 18px;
        font-weight: 600;
        color: #FFFFFF;
        letter-spacing: -0.01em;
      }
      .av-boot-row {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 12px;
        color: #8C8C8C;
      }
      .av-boot-spinner {
        width: 14px;
        height: 14px;
        border-radius: 50%;
        border: 2px solid rgba(255, 255, 255, 0.14);
        border-top-color: #FFFFFF;
        animation: av-boot-spin 0.75s linear infinite;
      }
      @keyframes av-boot-spin {
        to { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="av-boot-splash" role="status" aria-label="Loading AlgoVault">
        <img src="/splash-logo.png" alt="AlgoVault" class="av-boot-logo" />
        <div class="av-boot-title">AlgoVault</div>
        <div class="av-boot-row">
          <div class="av-boot-spinner"></div>
          <span>Loading application…</span>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
