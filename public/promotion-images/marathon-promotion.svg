<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="536" viewBox="0 0 1440 536" fill="none">
  <defs>
    <style>
      .headline {
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", Arial, sans-serif;
        font-weight: 900;
        font-style: italic;
        font-size: 52px;
        letter-spacing: -1px;
      }
      .body-text {
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", Arial, sans-serif;
        font-weight: 700;
        font-style: italic;
        font-size: 32px;
        letter-spacing: -0.3px;
      }
    </style>
  </defs>

  <g transform="translate(0, 10)">
    <!-- Outer Black + Mint Border of Speech Bubble (Top-Left Tail) -->
    <path
      d="M 216 128
         L 196 26
         L 372 124
         L 1192 124
         C 1298 126, 1358 186, 1368 280
         C 1378 374, 1326 446, 1192 448
         L 150 448
         C 66 448, 22 392, 28 294
         C 34 202, 114 134, 216 128 Z"
      fill="#00F5B8"
      stroke="#0A0A0A"
      stroke-width="16"
      stroke-linejoin="round"
    />

    <!-- Inner White Speech Bubble (Top-Left Tail) -->
    <path
      d="M 236 146
         L 222 62
         L 364 142
         L 1182 142
         C 1278 144, 1328 196, 1338 280
         C 1346 362, 1300 426, 1182 428
         L 160 428
         C 84 428, 48 378, 54 294
