      />
      <rect x="65" y="118" width="20" height="22" fill="#F59E0B" stroke="#0A0A0A" stroke-width="7" />
      <rect x="44" y="140" width="62" height="18" rx="6" fill="#0A4395" stroke="#0A0A0A" stroke-width="7" />
