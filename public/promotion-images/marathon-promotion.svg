    <!-- Headline -->

    <rect x="406" y="174" width="548" height="74" rx="37" fill="#00F5B8" />
    <text x="680" y="230" text-anchor="middle" fill="#0A0A0A" class="headline">Marathon Tracks</text>

    <!-- Explanatory Copy -->
    <text x="684" y="308" text-anchor="middle" fill="#0A0A0A" class="body-text">
      Follow a progressive quest map from easy warmups to hard summits,
    </text>
    <text x="684" y="362" text-anchor="middle" fill="#0A0A0A" class="body-text">
      unlocking new stages and milestone trophies as you solve each challenge.
    </text>
