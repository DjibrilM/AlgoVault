        <polygon points="20,-18 32,-26 44,-4 34,2" />
        <polygon points="118,-22 130,-12 112,8 102,-2" />
      </g>
      <path
        d="M 32 34 C 4 34, 4 82, 36 86"
        stroke="#0A0A0A"
        stroke-width="14"
        stroke-linecap="round"
        fill="none"
      />
      <path
        d="M 32 34 C 4 34, 4 82, 36 86"
        stroke="#FFD426"
        stroke-width="6"
        stroke-linecap="round"
        fill="none"
      />
      <path
        d="M 118 34 C 146 34, 146 82, 114 86"
        stroke="#0A0A0A"
        stroke-width="14"
        stroke-linecap="round"
        fill="none"
      />
      <path
        d="M 118 34 C 146 34, 146 82, 114 86"
        stroke="#FFD426"
        stroke-width="6"
        stroke-linecap="round"
        fill="none"
      />
      <path
        d="M 32 22 L 118 22 L 112 78 C 108 106, 92 118, 75 118 C 58 118, 42 106, 38 78 Z"
